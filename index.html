<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Gear Forecaster</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result_text {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2f5;
            border-radius: 6px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>When Are You Running?</h1>

        <label for="city_input">City:</label>
        <input type="text" id="city_input" value="Prague">

        <label for="time_input">Time:</label>
        <!-- Added step="1800" to restrict input to 30-minute (1800 second) increments -->
        <input type="datetime-local" id="time_input" step="1800">

        <button id="fetch_btn" onclick="fetchWeather()">Get Run Gear</button>

        <div id="result_text">Enter a location and time to gear up.</div>
    </div>

    <script>
        // Set the default datetime input to the nearest 30-minute mark of your current local time
        const now = new Date();
        const currentMinutes = now.getMinutes();
        // Snap to 00 or 30
        now.setMinutes(currentMinutes >= 30 ? 30 : 0, 0, 0); 
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('time_input').value = now.toISOString().slice(0, 16);

        async function fetchWeather() {
            const city = document.getElementById("city_input").value.trim();
            const timeStr = document.getElementById("time_input").value;
            const resultElement = document.getElementById("result_text");

            if (!city) {
                resultElement.innerText = "Please enter a city name.";
                return;
            }

            resultElement.innerText = "Fetching forecast...";

            try {
                const targetTime = new Date(timeStr);

                // 1. Get Coordinates
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
                const geoResp = await fetch(geoUrl);
                const geoData = await geoResp.json();

                if (!geoData.results || geoData.results.length === 0) {
                    resultElement.innerText = `Could not find city: ${city}`;
                    return;
                }

                const lat = geoData.results[0].latitude;
                const lon = geoData.results[0].longitude;

                // 2. Fetch Weather Forecast
                const fields = "temperature_2m,apparent_temperature,wind_speed_10m,precipitation,uv_index,is_day";
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=${fields}&hourly=${fields}&timezone=auto`;
                const weatherResp = await fetch(weatherUrl);
                const weatherData = await weatherResp.json();

                let temp, feelsLike, windSpeed, precipitation, uvIndex, isDay, displayTime;
                const nowMs = new Date().getTime();
                const targetMs = targetTime.getTime();

                // If target time is within 1 hour of right now, use real-time current values
                if (Math.abs(nowMs - targetMs) < 3600000) {
                    const current = weatherData.current;
                    temp = current.temperature_2m;
                    feelsLike = current.apparent_temperature;
                    windSpeed = current.wind_speed_10m;
                    precipitation = current.precipitation;
                    uvIndex = current.uv_index;
                    isDay = current.is_day === 1;
                    displayTime = "Right Now";
                } else {
                    const times = weatherData.hourly.time;
                    let closestIdx = 0;
                    let minDiff = Infinity;

                    for (let i = 0; i < times.length; i++) {
                        const apiTime = new Date(times[i]);
                        const diff = Math.abs(apiTime.getTime() - targetMs);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIdx = i;
                        }
                    }

                    temp = weatherData.hourly.temperature_2m[closestIdx];
                    feelsLike = weatherData.hourly.apparent_temperature[closestIdx];
                    windSpeed = weatherData.hourly.wind_speed_10m[closestIdx];
                    precipitation = weatherData.hourly.precipitation[closestIdx];
                    uvIndex = weatherData.hourly.uv_index[closestIdx];
                    isDay = weatherData.hourly.is_day[closestIdx] === 1;

                    const closestDate = new Date(times[closestIdx]);
                    const options = { weekday: 'long', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
                    displayTime = closestDate.toLocaleDateString('en-US', options);
                }

                // Guard against missing/null values from the API
                if (feelsLike === null || feelsLike === undefined) feelsLike = temp;
                if (uvIndex === null || uvIndex === undefined) uvIndex = 0;

                const windy = windSpeed > 20.0;
                const rainy = precipitation > 0.5;

                const recommendation = getClothingRecommendation(temp, feelsLike, windy, rainy, uvIndex, isDay);
                const timeIcon = isDay ? "☀️" : "🌙";

                resultElement.innerText =
                    `⏱️ Forecast for: ${displayTime} ${timeIcon}\n` +
                    `🌡️ Temp: ${temp}°C (feels ${feelsLike}°C) | 💨 Wind: ${windSpeed} km/h | 🌧️ Rain: ${precipitation} mm | ☀️ UV: ${uvIndex}\n\n` +
                    `--- Running Gear Recommendation ---\n` +
                    `${recommendation}`;

            } catch (e) {
                resultElement.innerText = `Network Error: ${e.message}`;
            }
        }

        function getClothingRecommendation(temp, feelsLike, windy, rainy, uvIndex, isDay) {
            const t = feelsLike;

            // --- Bottoms ---
            let bottoms;
            if (t >= 10) {
                bottoms = "running shorts";
            } else if (t >= 0) {
                bottoms = "light running tights";
            } else {
                bottoms = "thermal winter running tights";
            }

            // --- Tops ---
            let tops;
            if (t >= 20) {
                tops = "a moisture-wicking singlet or tank top";
            } else if (t >= 12) {
                tops = "a short-sleeve tech shirt";
            } else if (t >= 5) {
                tops = "a long-sleeve moisture-wicking shirt";
            } else if (t >= -5) {
                tops = "a long-sleeve base layer";
            } else {
                tops = "a thermal base layer and an insulating mid-layer";
            }

            // --- Outer shell ---
            let shell = null;
            if (rainy) {
                shell = (t < 15)
                    ? "a water-resistant running jacket"
                    : "a light water-resistant shell (or just a cap if you don't mind getting wet)";
            } else if (t < -5) {
                shell = "a windproof running jacket";
            } else if (windy && t < 12) {
                shell = "a light running windbreaker";
            }

            // --- Accessories ---
            let accessories = [];
            if (shell) accessories.push(shell);

            if (rainy) {
                accessories.push("a running cap with a brim (keeps rain out of your eyes)");
            }

            if (t < 5 && t >= -5) {
                accessories.push("light running gloves and a thin headband or beanie");
            } else if (t < -5) {
                accessories.push("warm running gloves, a thermal beanie, and a neck gaiter (buff)");
            }

            if (isDay && !rainy && uvIndex >= 3) {
                accessories.push("running sunglasses");
            }
            if (isDay && uvIndex >= 6) {
                accessories.push("sweat-resistant sunscreen (UV is high)");
            }

            let extrasDisplay;
            if (accessories.length > 0) {
                const accText = accessories.map(item => item.charAt(0).toUpperCase() + item.slice(1)).join("\n   - ");
                extrasDisplay = `\n   - ${accText}`;
            } else {
                extrasDisplay = " Nothing special";
            }

            const capBottoms = bottoms.charAt(0).toUpperCase() + bottoms.slice(1);
            const capTops = tops.charAt(0).toUpperCase() + tops.slice(1);

            return `👖 Bottoms: ${capBottoms}\n👕 Tops: ${capTops}\n👟 Extras:${extrasDisplay}`;
        }
    </script>
</body>
</html>
