<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Gear Forecaster</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input[type="text"], input[type="datetime-local"], select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 8px;
        }
        .slider-ends {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #9bbfe0; cursor: default; }
        #result_text {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2f5;
            border-radius: 6px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>When Are You Running?</h1>
        <p class="subtitle">Recommendations assume you'll warm up once moving,
        so you should feel slightly cool for the first few minutes.
        Time is the local time at the city.</p>

        <label for="city_select">City:</label>
        <select id="city_select">
            <option value="Prague">Praha / Prague</option>
            <option value="Koblasko">Koblasko</option>
            <option value="__other__">Other (type below)…</option>
        </select>
        <input type="text" id="city_input" placeholder="Type a city name" style="display:none; margin-top:8px;">

        <label for="time_input">Time:</label>
        <input type="datetime-local" id="time_input" step="900">

        <label for="offset_input">Body thermostat: <span id="offset_label">Neutral</span></label>
        <input type="range" id="offset_input" min="-4" max="4" step="1" value="0">
        <div class="slider-ends">
            <span>I run cold → more layers</span>
            <span>I run warm → fewer layers</span>
        </div>

        <button id="fetch_btn" onclick="fetchWeather()">Get Run Gear</button>

        <div id="result_text">Enter a location and time to gear up.</div>
    </div>

    <script>
        const timeInput = document.getElementById('time_input');
        const offsetInput = document.getElementById('offset_input');
        const offsetLabel = document.getElementById('offset_label');
        const fetchBtn = document.getElementById('fetch_btn');
        const citySelect = document.getElementById('city_select');
        const cityInput = document.getElementById('city_input');

        // Show the free-text box only when "Other" is selected.
        citySelect.addEventListener('change', () => {
            const other = citySelect.value === '__other__';
            cityInput.style.display = other ? 'block' : 'none';
            if (other) cityInput.focus();
        });

        function getCity() {
            return citySelect.value === '__other__'
                ? cityInput.value.trim()
                : citySelect.value;
        }

        // Default the time to now, rounded to the nearest 15 min (matches the picker step).
        const pad = n => String(n).padStart(2, '0');
        const now = new Date();
        now.setMinutes(Math.round(now.getMinutes() / 15) * 15, 0, 0);
        timeInput.value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}` +
            `T${pad(now.getHours())}:${pad(now.getMinutes())}`;

        function updateOffsetLabel() {
            const v = parseInt(offsetInput.value, 10);
            if (v === 0) offsetLabel.textContent = "Neutral";
            else if (v < 0) offsetLabel.textContent = `Run cold (dress warmer) ${v}°C`;
            else offsetLabel.textContent = `Run warm (dress lighter) +${v}°C`;
        }
        offsetInput.addEventListener('input', updateOffsetLabel);
        updateOffsetLabel();

        // Treat a naive "YYYY-MM-DDTHH:MM" wall-clock string as local time at the
        // given UTC offset (seconds), returning a true absolute instant in ms.
        function naiveToInstant(naiveStr, offsetSec) {
            const [datePart, timePart] = naiveStr.split('T');
            const [y, mo, d] = datePart.split('-').map(Number);
            const [h, mi] = timePart.split(':').map(Number);
            return Date.UTC(y, mo - 1, d, h, mi) - offsetSec * 1000;
        }

        // Format a naive city-local time string for display, no timezone conversion.
        function formatCityTime(naiveStr) {
            const [datePart, timePart] = naiveStr.split('T');
            const [y, mo, d] = datePart.split('-').map(Number);
            const [h, mi] = timePart.split(':').map(Number);
            const dt = new Date(Date.UTC(y, mo - 1, d, h, mi));
            const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getUTCDay()];
            const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mo - 1];
            return `${wd}, ${mon} ${d}, ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
        }

        async function fetchWeather() {
            const city = getCity();
            const timeStr = timeInput.value;
            const offset = parseInt(offsetInput.value, 10) || 0;
            const resultElement = document.getElementById("result_text");

            if (!city) {
                resultElement.innerText = "Please enter a city name.";
                return;
            }
            if (!timeStr) {
                resultElement.innerText = "Please pick a time.";
                return;
            }

            fetchBtn.disabled = true;
            resultElement.innerText = "Fetching forecast...";

            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
                const geoResp = await fetch(geoUrl);
                const geoData = await geoResp.json();

                if (!geoData.results || geoData.results.length === 0) {
                    resultElement.innerText = `Could not find city: ${city}`;
                    return;
                }

                const lat = geoData.results[0].latitude;
                const lon = geoData.results[0].longitude;

                const fields = "temperature_2m,apparent_temperature,wind_speed_10m,precipitation,uv_index,is_day";
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                    `&current=${fields}&hourly=${fields}&timezone=auto&forecast_days=16&past_days=1`;
                const weatherResp = await fetch(weatherUrl);
                const weatherData = await weatherResp.json();

                const utcOffsetSec = weatherData.utc_offset_seconds || 0;
                const nowMs = Date.now();
                const targetMs = naiveToInstant(timeStr, utcOffsetSec);

                let airTemp, feelsLike, windSpeed, precipitation, uvIndex, isDay, displayTime;

                if (Math.abs(nowMs - targetMs) < 3600000) {
                    const current = weatherData.current;
                    airTemp = current.temperature_2m;
                    feelsLike = current.apparent_temperature;
                    windSpeed = current.wind_speed_10m;
                    precipitation = current.precipitation;
                    uvIndex = current.uv_index;
                    isDay = current.is_day === 1;
                    displayTime = "Right Now";
                } else {
                    const times = weatherData.hourly.time;
                    let closestIdx = 0;
                    let minDiff = Infinity;

                    for (let i = 0; i < times.length; i++) {
                        const diff = Math.abs(naiveToInstant(times[i], utcOffsetSec) - targetMs);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIdx = i;
                        }
                    }

                    // Guard: if the nearest available hour is more than ~1h away, the
                    // requested time is outside the forecast window (about 16 days).
                    if (minDiff > 3600000) {
                        resultElement.innerText =
                            "That time is outside the available forecast window " +
                            "(roughly 1 day back to 16 days ahead). Pick a closer time.";
                        return;
                    }

                    airTemp = weatherData.hourly.temperature_2m[closestIdx];
                    feelsLike = weatherData.hourly.apparent_temperature[closestIdx];
                    windSpeed = weatherData.hourly.wind_speed_10m[closestIdx];
                    precipitation = weatherData.hourly.precipitation[closestIdx];
                    uvIndex = weatherData.hourly.uv_index[closestIdx];
                    isDay = weatherData.hourly.is_day[closestIdx] === 1;
                    displayTime = formatCityTime(times[closestIdx]);
                }

                // Fallbacks for occasionally-missing fields.
                if (airTemp === null || airTemp === undefined) {
                    resultElement.innerText = "Temperature data unavailable for that time.";
                    return;
                }
                if (feelsLike === null || feelsLike === undefined) feelsLike = airTemp;
                if (windSpeed === null || windSpeed === undefined) windSpeed = 0;
                if (precipitation === null || precipitation === undefined) precipitation = 0;
                if (uvIndex === null || uvIndex === undefined) uvIndex = 0;

                const windy = windSpeed > 20.0;
                const rainy = precipitation > 0.5;

                const rec = getClothingRecommendation(airTemp, feelsLike, windy, rainy, uvIndex, isDay, offset);
                const timeIcon = isDay ? "☀️" : "🌙";

                const airR = Math.round(airTemp);
                const feelsR = Math.round(feelsLike);
                const windR = Math.round(windSpeed);
                const rainR = Math.round(precipitation * 10) / 10;
                const uvR = Math.round(uvIndex * 10) / 10;

                // Owned "extras" block
                let extrasDisplay;
                if (rec.owned.length > 0) {
                    extrasDisplay = "\n   - " + rec.owned.join("\n   - ");
                } else {
                    extrasDisplay = " Nothing special";
                }

                // Missing-gear block (things not in your wardrobe, flagged)
                let missingDisplay = "";
                if (rec.missing.length > 0) {
                    missingDisplay += "\n\n🎒 Don't own — consider packing / getting:";
                    for (const m of rec.missing) {
                        missingDisplay += `\n   ⚠️ ${m.item}  (${m.severity})\n        → ${m.why}`;
                    }
                }

                const offsetLine = offset !== 0
                    ? `🎚️ Personal adjust: ${offset > 0 ? '+' : ''}${offset}°C ` +
                      `(${offset > 0 ? 'dressing lighter' : 'dressing warmer'})\n`
                    : "";

                resultElement.innerText =
                    `⏱️ Forecast for: ${displayTime} ${timeIcon}\n` +
                    `🌡️ Air: ${airR}°C (feels ${feelsR}°C) | 💨 Wind: ${windR} km/h | 🌧️ Rain: ${rainR} mm | ☀️ UV: ${uvR}\n` +
                    offsetLine +
                    `\n--- Your Running Gear ---\n` +
                    `👖 Bottoms: ${rec.bottoms}\n` +
                    `👕 Tops: ${rec.tops}\n` +
                    `🧦 Socks: ${rec.socks}\n` +
                    `👟 Extras:${extrasDisplay}` +
                    missingDisplay;

            } catch (e) {
                resultElement.innerText = `Network Error: ${e.message}`;
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function getClothingRecommendation(airTemp, feelsLike, windy, rainy, uvIndex, isDay, offset) {
            // Decisions run off AIR temperature (the warm-up discount is baked into the
            // thresholds below), shifted by your personal offset. Wind and rain are
            // handled separately as modifiers, so wind is not double-counted.
            const t = airTemp + (offset || 0);

            // --- Bottoms (legs generate heat fast — least temperature-sensitive) ---
            let bottoms;
            if (t >= 10) {
                bottoms = "Running elastic shorts";
            } else if (t >= 0) {
                bottoms = "Light long tights";
            } else if (t >= -5) {
                bottoms = "Warm long tights";
            } else {
                bottoms = "Warm long tights with your BJJ shorts layered on top";
            }

            // --- Tops (recalibrated ~4-5°C lighter than standing-still comfort) ---
            let tops;
            if (t >= 14) {
                tops = "Short sleeve technical shirt";
            } else if (t >= 8) {
                tops = "Long sleeve technical shirt (or BJJ long sleeve rashguard)";
            } else if (t >= 3) {
                tops = "Warm long sleeve technical shirt";
            } else if (t >= -3) {
                tops = "Warm long sleeve technical shirt with your BJJ short sleeve rashguard layered on top";
            } else {
                tops = "Warm long sleeve technical shirt and your Fleece";
            }

            // --- Socks ---
            let socks = (t < 5) ? "Warm running socks" : "Normal running socks";

            const owned = [];   // in your wardrobe
            const missing = []; // not owned — flagged for you to pack / consider

            // --- Wind shell: your vest blocks wind on the core. Added for wind only,
            //     NOT folded into the base layers, so nothing is double-counted. ---
            if (windy && t < 13) {
                owned.push("Light vest (blocks the wind on your core)");
            }

            // --- Head / ears (first thing to go cold; wind brings it on sooner) ---
            let headItem = null; // "beanie" | "earband" | null
            if (t < 1 || (windy && t < 4)) {
                owned.push("Warm cap (beanie — covers your ears)");
                headItem = "beanie";
            } else if (t < 7 || (windy && t < 10)) {
                // A full beanie runs too hot here, but ears still want cover.
                missing.push({
                    item: "Ear band / headband",
                    why: "Ears get cold around 3-8°C" + (windy ? " and it's windy" : "") +
                         ", but your beanie is too warm once you're moving. This fills the gap.",
                    severity: "Optional"
                });
                headItem = "earband";
            }

            // --- Rain: brim to keep water off your eyes, plus the shell you don't own ---
            if (rainy) {
                if (headItem !== "beanie") {
                    owned.push("Light cap (brim keeps rain off your eyes/glasses)");
                }
                if (t < 4) {
                    missing.push({
                        item: "Waterproof shell (packable rain jacket, ideally hooded)",
                        why: "Cold rain below ~4°C: wet clothing strips heat fast. For anything " +
                             "beyond a short easy run this is effectively required, not optional.",
                        severity: "Strongly recommended"
                    });
                } else if (t < 10) {
                    missing.push({
                        item: "Waterproof shell (packable rain jacket)",
                        why: "Below ~10°C, wet plus any wind pulls heat away far faster than dry air " +
                             "at the same temperature — worth having, especially on longer runs.",
                        severity: "Recommended"
                    });
                }
                // Above ~10°C rain is a comfort issue only — the brim cap is enough.
            }

            // --- Hands ---
            if (t < 8 || (windy && t < 12)) {
                owned.push("Tight Decathlon running gloves");
            }

            // --- Neck ---
            if (t < -3 || (windy && t < 2)) {
                owned.push("Neck gaiter");
            }

            // --- Deep cold + wind: fleece isn't windproof and the vest is sleeveless,
            //     so your arms take the chill. Optional gap-filler. ---
            if (windy && t <= -3) {
                missing.push({
                    item: "Windproof running jacket",
                    why: "In deep cold with wind, your fleece isn't windproof and the vest is " +
                         "sleeveless, so your arms get wind-chilled. Core is covered; this seals the arms.",
                    severity: "Optional"
                });
            }

            // --- Sun protection ---
            if (isDay && !rainy && uvIndex >= 3) {
                owned.push("Running sunglasses");
            }
            if (isDay && uvIndex >= 6) {
                owned.push("Sunscreen (UV is high)");
            }

            return { bottoms, tops, socks, owned, missing };
        }
    </script>
</body>
</html>
